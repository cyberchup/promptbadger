[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "promptbadger"
version = "0.3.1"
description = "Detection-as-code for LLM prompt injection: Sigma-style YAML rules mapped to MITRE ATLAS and the OWASP LLM Top 10."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dylan Wood" }]
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]
keywords = [
  "llm", "prompt-injection", "jailbreak", "llm-security", "security",
  "detection-engineering", "mitre-atlas", "owasp", "siem",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/cyberchup/promptbadger"
Source = "https://github.com/cyberchup/promptbadger"
Issues = "https://github.com/cyberchup/promptbadger/issues"
Changelog = "https://github.com/cyberchup/promptbadger/releases"

[project.optional-dependencies]
dev = ["pytest>=7"]
eval = ["datasets>=2.14"]
# Training the classifier only; inference is pure Python.
train = ["datasets>=2.14", "scikit-learn>=1.3"]

[project.scripts]
promptbadger = "promptbadger.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
promptbadger = ["rules/*.yml", "data/*.json.gz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
