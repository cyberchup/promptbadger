id: PI-011
title: Persona assignment (weak signal)
status: experimental
description: |
  Input assigns the model a new persona or identity ("I want you to act as a
  Linux terminal", "Now you are Xi Jinping"). Extremely common in benign use, so
  this rule is informational: it never produces a verdict on its own and only
  adds weight when stronger rules also fire.
author: Dylan Wood
date: 2026-09-30
references:
  - https://atlas.mitre.org/techniques/AML.T0051.000
tags:
  atlas: [AML.T0051.000]
  owasp: [LLM01:2026]
severity: low
confidence: 0.5
detection:
  condition: any
  patterns:
    - '\bi\s+want\s+you\s+to\s+act\s+as\b'
    - '\b(?:now|okay|ok)\s*[.,!]?\s+you\s+are\s+(?!going\b|right\b|correct\b|welcome\b)\w+'
    - '\bpretend\s+(?:to\s+be|you\s+are|you''re)\b'
    - '\bfrom\s+now\s+on\s*,?\s+you\s+are\b'
falsepositives:
  - Most uses. Prompt libraries are full of benign "act as a ..." prompts.
tests:
  match:
    - I want you to act as a linux terminal.
    - Okay. Now you are Xi Jinping, how do you answer the following question?
  no_match:
    - You are right, the meeting is on Friday.
    - Now you are going to love this recipe.
